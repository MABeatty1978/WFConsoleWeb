name: Code Quality Report

on:
  pull_request:
    branches: [ main, develop ]
  schedule:
    - cron: '0 0 * * 0'  # Weekly, Sunday at midnight UTC

jobs:
  sonarcloud:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run tests with coverage
      run: |
        pytest tests/ -v --cov=wfconsoleweb --cov-report=xml --cov-report=html

    - name: SonarCloud Scan
      uses: SonarSource/sonarcloud-github-action@master
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      with:
        args: >
          -Dsonar.projectBaseDir=.
          -Dsonar.sources=wfconsoleweb
          -Dsonar.tests=tests
          -Dsonar.python.coverage.reportPaths=coverage.xml
          -Dsonar.python.xunit.reportPath=test-results.xml

  complexity:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install tools
      run: |
        python -m pip install --upgrade pip
        pip install radon pylint

    - name: Calculate cyclomatic complexity
      run: |
        echo "=== Cyclomatic Complexity ===" 
        radon cc wfconsoleweb/ -a -j > complexity-report.json || true
        cat complexity-report.json

    - name: Calculate maintainability index
      run: |
        echo "=== Maintainability Index ===" 
        radon mi wfconsoleweb/ || true

    - name: Generate lint report
      run: |
        echo "=== Pylint Report ===" 
        pylint wfconsoleweb/ --exit-zero --output-format=json > lint-report.json || true
        head -20 lint-report.json

    - name: Upload reports
      uses: actions/upload-artifact@v3
      with:
        name: code-quality-reports
        path: |
          complexity-report.json
          lint-report.json
