version: '3.8'

services:
  wfconsoleweb:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: wfconsoleweb
    volumes:
      # Persist database and configuration
      - wfconsole_data:/app/data
      # Optional: mount .env file for sensitive configuration
      # - ./.env:/app/.env:ro
    environment:
      # Server configuration
      - HOST=0.0.0.0
      - PORT=8000
      - RELOAD=false
      
      # Database (use volume for persistence)
      - DATABASE_URL=sqlite:////app/data/wfpiconsole.db
      
      # Security - Generate with: openssl rand -hex 32
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-random-value}
      
      # WeatherFlow API (update with your values)
      - WEATHERFLOW_API_KEY=${WEATHERFLOW_API_KEY:-}
      - DEVICE_ID=${DEVICE_ID:-}
      
      # UDP listener for local data (if your Tempest is on same network)
      - UDP_PORT=50222
      - UDP_LISTEN=true
      
      # Logging
      - LOG_LEVEL=INFO
    
    # Host network is used for UDP listener access.
    # Port mappings are not used with host networking.
    network_mode: "host"
    
    # Resource limits (adjust based on your system)
    restart: unless-stopped
    
    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  wfconsole_data:
    driver: local

